[workspace]
authors = ["SSI-DK"]
channels = ["conda-forge", "bioconda"]
name = "ubio-autobox"
platforms = ["linux-64", "osx-arm64"]
version = "0.2.0"

[dependencies]
python = "3.11.*"
pip = ">=25,<27"

[target.linux-64.dependencies]
bactopia = "4.0.0.*"
docker-cli = ">=28,<30"
nextflow = "26.04.6.*"

[pypi-dependencies]
ubio-autobox = { path = ".", editable = true, extras = ["dev", "local"] }

[tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
type-check = "mypy src/ubio_autobox"
test = "pytest"
test-cov = "pytest --cov=ubio_autobox --cov-report=term-missing"
dagster-dev = "dagster dev -m ubio_autobox.definitions"
validate-definitions = "python -c \"from ubio_autobox.definitions import defs; print(len(defs.resolve_all_asset_specs()))\""
