[project]
name = "ubio-autobox"
version = "0.2.0"
description = "Automated Bactopia processing with Dagster and AllTheBacteria-compatible outputs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "SSI-DK" }]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "alembic>=1.14,<2",
    "dagster>=1.13,<1.14",
    "dagster-pipes>=1.13,<1.14",
    "dagster-slurm>=1.15.1,<1.16",
    "duckdb>=1.3,<2",
    "duckdb-engine>=0.17,<1",
    "pandas>=2.2,<4",
    "pyarrow>=18,<30",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "PyYAML>=6,<7",
    "SQLAlchemy>=2.0,<3",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
local = [
    "dagster-postgres>=0.29,<0.30",
    "dagster-webserver>=1.13,<1.14",
    "psycopg2-binary>=2.9,<3",
]
mssql = ["pyodbc>=5,<6"]
dev = [
    "coverage[toml]>=7,<8",
    "mypy>=1.14,<2",
    "pandas-stubs>=2.2,<4",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
ubio-autobox = "ubio_autobox.cli:app"

[project.urls]
Homepage = "https://github.com/ssi-dk/ubio_autobox"
Repository = "https://github.com/ssi-dk/ubio_autobox.git"
Issues = "https://github.com/ssi-dk/ubio_autobox/issues"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ubio_autobox = [
    "execution/*.py",
    "migrations/alembic.ini",
    "migrations/script.py.mako",
    "projection/schemas/*.json",
]

[tool.dagster]
module_name = "ubio_autobox.definitions"
code_location_name = "ubio_autobox"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "integration: requires local external services",
    "bactopia: requires Bactopia and its reference data",
    "slurm: requires a Slurm deployment",
]

[tool.coverage.run]
source = ["ubio_autobox"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ubio_autobox"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "dagster.*",
    "dagster_pipes.*",
    "dagster_slurm.*",
    "pyarrow.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "N",
    "S",
    "UP",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["N999"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
