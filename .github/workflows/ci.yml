name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true
      - run: pixi run format-check
      - run: pixi run lint
      - run: pixi run type-check
      - run: pixi run test
